server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip JSON / JS / CSS for faster loads.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # SPA fallback: React Router paths like /login must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the sibling `api` container on the Docker network.
    # Browser talks to one origin (http://localhost) — same as Vite's /api proxy in dev.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ask / LLM calls can take a while.
        proxy_read_timeout 120s;
    }
}
