<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QueryLens — ask your PostgreSQL database questions in plain English." />
    <meta name="theme-color" content="#07080b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>QueryLens — ask your database anything</title>
  </head>
  <body>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var root = document.documentElement;
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || ((!theme || theme === 'system') && systemDark)) {
            root.classList.add('dark');
          } else {
            root.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
